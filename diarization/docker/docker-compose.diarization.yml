# Standalone self-hosted speaker diarization stack.
#
# Usage (run from the diarization/docker/ directory):
#   docker compose -f docker-compose.diarization.yml up -d
#
# POST audio + transcript to http://localhost:8090/v1/diarize (see README).

# The project name keeps this stack apart from the sync stack. Both files are in
# a docker/ directory and both have a license-and-usage-proxy service.
name: diarization

services:
  diarization-api:
    image: ${DIARIZATION_API_IMAGE}
    ports:
      - "8090:8080"
    environment:
      - HTTP_PORT=8080
      - AAI_ENV=production
      - LOGGING_LEVEL=INFO
      - USE_STRUCTURED_LOGGING=False
      # Enables self-hosted usage reporting + the license-validation thread.
      - LICENSE_AND_USAGE_PROXY_ENDPOINT=http://license-and-usage-proxy:8080
      # Limits — override in .env (see "Limits" in the README).
      - MAX_AUDIO_DURATION_MS=${MAX_AUDIO_DURATION_MS:-3600000}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-1073741824}
      - INFERENCE_TIMEOUT_SECONDS=${INFERENCE_TIMEOUT_SECONDS:-300}
      # Requests diarized at once. CUDA graphs (the fast path) run only with 1.
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-1}
    healthcheck:
      # Ready once the model is loaded and warm.
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 300s
    depends_on:
      - license-and-usage-proxy
    networks:
      - diarization-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  license-and-usage-proxy:
    image: ${LICENSE_AND_USAGE_PROXY_IMAGE}
    ports:
      - "8092:8080"
    environment:
      - HTTP_PORT=8080
      - LOGGING_LEVEL=INFO
      - USE_STRUCTURED_LOGGING=False
      - LICENSE_FILE_PATH=/var/aai_license.jwt
      - USAGE_TRACKING_API_KEY=${USAGE_TRACKING_API_KEY} # Set if license is for usage-based billing
    volumes:
      - ./license.jwt:/var/aai_license.jwt:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 2
      start_period: 10s
    networks:
      - diarization-network

networks:
  diarization-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
