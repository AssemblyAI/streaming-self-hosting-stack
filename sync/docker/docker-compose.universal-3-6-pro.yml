# Standalone self-hosted sync (synchronous full-file HTTP) transcription stack
# serving the Universal-3.6 Pro model (SYNC_API_IMAGE).
#
# Sync is self-contained: a single GPU container that does its
# own inference, so this stack is just the API plus the license-and-usage-proxy
# — no streaming-api, no nginx load balancer, no separate gRPC ASR backend.
#
# Usage (run from the sync/docker/ directory):
#   docker compose -f docker-compose.universal-3-6-pro.yml up -d
#
# POST audio to http://localhost:8080/transcribe (see README + example/).

# The project name keeps this stack apart from the diarization stack. Both files
# are in a docker/ directory and both have a license-and-usage-proxy service.
name: sync

services:
  sync-api:
    image: ${SYNC_API_IMAGE}
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - AAI_ENV=production
      - LOGGING_LEVEL=INFO
      - USE_STRUCTURED_LOGGING=False
      # GPU monitoring emits to CloudWatch; off in self-hosted deployments.
      - GPU_MONITORING_ENABLED=False
      # Enables self-hosted usage reporting + the license-validation thread.
      - LICENSE_AND_USAGE_PROXY_ENDPOINT=http://license-and-usage-proxy:8080
      # Audio limits — override in .env (see "Audio limits" in the README).
      # Raising MAX_AUDIO_DURATION_MS usually also requires
      # raising MAX_REQUEST_BYTES (the body cap: 256 MB fits ~20 min at 48 kHz
      # stereo WAV) and INFERENCE_TIMEOUT_SECONDS (per-request deadline,
      # including the upload).
      - MAX_AUDIO_DURATION_MS=${MAX_AUDIO_DURATION_MS:-3600000}
      - MIN_AUDIO_DURATION_MS=${MIN_AUDIO_DURATION_MS:-80}
      - MAX_REQUEST_BYTES=${MAX_REQUEST_BYTES:-268435456}
      - INFERENCE_TIMEOUT_SECONDS=${INFERENCE_TIMEOUT_SECONDS:-300}
    healthcheck:
      # Ready once the model is warm (about 10 to 25 minutes on every start).
      test: ["CMD", "/opt/python/bin/python3", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:8080/readyz', timeout=2)"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 1800s
    depends_on:
      - license-and-usage-proxy
    networks:
      - sync-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  license-and-usage-proxy:
    image: ${LICENSE_AND_USAGE_PROXY_IMAGE}
    ports:
      - "8082:8080"
    environment:
      - HTTP_PORT=8080
      - LOGGING_LEVEL=INFO
      - USE_STRUCTURED_LOGGING=False
      - LICENSE_FILE_PATH=/var/aai_license.jwt
      - USAGE_TRACKING_API_KEY=${USAGE_TRACKING_API_KEY} # Set if license is for usage-based billing
    volumes:
      - ./license.jwt:/var/aai_license.jwt:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 2
      start_period: 10s
    networks:
      - sync-network

networks:
  sync-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
